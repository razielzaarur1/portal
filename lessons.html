<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הקלטות שיעורים - פורטל לימודים</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rubik', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            background-attachment: fixed;
            color: #0f172a;
            min-height: 100vh;
        }
        .portal-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }
        .portal-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        .lesson-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .lesson-card:hover {
            border-color: #93c5fd;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
        }
        .lesson-card.is-watched {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .lesson-card.is-watched:hover {
            border-color: #86efac;
        }
        .tab-pill {
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.15s ease;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
        }
        .tab-pill:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
        .tab-pill.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
    </style>
</head>
<body class="p-3 sm:p-5 md:p-6">

    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- Header -->
        <header class="portal-card rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
            
            <div class="flex items-center gap-3">
                <button onclick="handleGoBack()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 hover:text-slate-900 transition-colors flex items-center gap-2 text-sm font-medium border border-slate-200 shrink-0">
                    <i class="fas fa-arrow-right"></i>
                    <span>חזרה</span>
                </button>
                <div class="min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span id="course-badge" class="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-0.5 rounded-full font-bold">
                            הקלטות שיעורים
                        </span>
                    </div>
                    <h1 id="course-title" class="text-lg sm:text-2xl font-bold text-slate-800 mt-0.5 truncate">
                        טוען...
                    </h1>
                </div>
            </div>

            <!-- Toolbar Controls -->
            <div class="flex items-center gap-2.5 flex-wrap justify-between md:justify-end">
                
                <!-- Watch Next Lesson Button (Compact) -->
                <button id="next-lesson-btn" onclick="handleWatchNextLesson()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm flex items-center gap-2 shadow-sm transition-all hover:shadow active:scale-95" style="display: none;">
                    <i class="fas fa-play text-xs"></i>
                    <span id="next-lesson-btn-text">שיעור הבא</span>
                    <i class="fas fa-arrow-up-right-from-square text-[10px] opacity-75"></i>
                </button>

                <!-- Progress Pill -->
                <div id="progress-pill-container" class="px-3 py-1.5 rounded-xl bg-slate-100 border border-slate-200 flex items-center gap-2 text-xs font-medium text-slate-700">
                    <i class="fas fa-chart-pie text-blue-600"></i>
                    <span id="progress-text">0/0 נצפו</span>
                    <span id="progress-pct" class="font-bold text-blue-600">0%</span>
                </div>

                <!-- Open Drive Link -->
                <a href="drive.html" id="open-in-drive-btn" class="px-3 py-2 rounded-xl bg-white hover:bg-slate-50 text-slate-600 hover:text-slate-900 text-xs font-medium border border-slate-200 flex items-center gap-1.5 transition-colors">
                    <i class="fas fa-folder-open text-amber-500"></i>
                    <span>תיקיית קבצים</span>
                </a>
            </div>
        </header>

        <!-- Loading State -->
        <div id="loading-spinner" class="py-16 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-50 text-blue-600 mb-3 animate-spin">
                <i class="fas fa-circle-notch text-2xl"></i>
            </div>
            <p class="text-sm font-medium text-slate-500">טוען את השיעורים...</p>
        </div>

        <!-- Error State -->
        <div id="error-box" class="hidden portal-card rounded-2xl p-6 text-center max-w-md mx-auto">
            <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 mx-auto flex items-center justify-center text-xl mb-3">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800 mb-1">לא נמצאו הקלטות</h3>
            <p id="error-message" class="text-xs text-slate-500 mb-4"></p>
            <button onclick="handleGoBack()" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold hover:bg-blue-700 transition-colors">
                חזרה לקורס
            </button>
        </div>

        <!-- Hub View (when accessed without courseId) -->
        <div id="courses-hub-view" class="hidden space-y-4">
            <div class="portal-card rounded-2xl p-5 sm:p-6 bg-gradient-to-r from-blue-50/60 to-white">
                <h2 class="text-xl font-bold text-slate-800">מאגר הקלטות שיעורים ותרגולים</h2>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">
                    בחר קורס כדי לצפות ברשימת ההקלטות, חלוקה לסדרות ומעקב אחר התקדמות הלימוד.
                </p>
            </div>
            <div id="courses-hub-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                <!-- Courses injected dynamically -->
            </div>
        </div>

        <!-- Main Lessons View -->
        <main id="main-content" class="hidden space-y-3">
            
            <!-- Series Tabs (Shown only if multiple series exist) -->
            <div id="series-tabs-container" class="portal-card rounded-xl p-2.5 flex items-center gap-2 overflow-x-auto" style="display: none;">
                <span class="text-xs font-bold text-slate-500 ml-2 shrink-0">סדרה:</span>
                <div id="series-tabs-list" class="flex items-center gap-2">
                    <!-- Series tabs injected dynamically -->
                </div>
            </div>

            <!-- Filter & Actions Bar -->
            <div class="portal-card rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 text-xs">
                
                <!-- Filters -->
                <div class="flex items-center gap-1.5">
                    <span class="text-slate-400 font-medium ml-1">סינון:</span>
                    <button id="filter-btn-all" onclick="setFilter('all')" class="tab-pill active">
                        הכל (<span id="count-all">0</span>)
                    </button>
                    <button id="filter-btn-unwatched" onclick="setFilter('unwatched')" class="tab-pill">
                        טרם נצפו (<span id="count-unwatched">0</span>)
                    </button>
                    <button id="filter-btn-watched" onclick="setFilter('watched')" class="tab-pill">
                        נצפו (<span id="count-watched">0</span>)
                    </button>
                </div>

                <!-- Bulk Actions -->
                <div class="flex items-center gap-2 mr-auto">
                    <button onclick="handleMarkAllCurrentWatched(true)" class="px-2.5 py-1.5 rounded-lg text-slate-600 hover:text-emerald-700 hover:bg-emerald-50 border border-slate-200 text-xs font-medium transition-colors flex items-center gap-1">
                        <i class="fas fa-check-double text-[10px]"></i>
                        <span>סמן הכל</span>
                    </button>
                    <button onclick="handleMarkAllCurrentWatched(false)" class="px-2.5 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 border border-slate-200 text-xs font-medium transition-colors flex items-center gap-1">
                        <i class="fas fa-rotate-left text-[10px]"></i>
                        <span>אפס</span>
                    </button>
                </div>
            </div>

            <!-- Empty Filter State -->
            <div id="empty-filter-state" class="hidden portal-card rounded-xl p-8 text-center text-slate-400 text-sm">
                אין שיעורים התואמים את הסינון הנוכחי.
            </div>

            <!-- Lessons Grid (Dense & Spread out nicely) -->
            <div id="lessons-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2.5">
                <!-- Lesson cards injected dynamically -->
            </div>

        </main>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const courseIdParam = urlParams.get('courseId');
        const pathParam = urlParams.get('path');
        const tz = localStorage.getItem('student_tz') || '';

        let courseData = null;
        let activeSeriesIndex = 0;
        let watchedSet = new Set();
        let currentFilter = 'all'; // 'all' | 'unwatched' | 'watched'

        // Local Storage Key
        const rawKey = courseIdParam || (pathParam ? encodeURIComponent(pathParam) : 'general');
        const storageKey = `recording_watched_${rawKey}`;
        const legacyStorageKey = `miluim_watched_${rawKey}`;

        function loadLocalWatched() {
            try {
                const stored = localStorage.getItem(storageKey) || localStorage.getItem(legacyStorageKey);
                if (stored) {
                    const arr = JSON.parse(stored);
                    if (Array.isArray(arr)) {
                        arr.forEach(id => watchedSet.add(id));
                    }
                }
            } catch(e) {}
        }

        function saveLocalWatched() {
            try {
                const json = JSON.stringify(Array.from(watchedSet));
                localStorage.setItem(storageKey, json);
                localStorage.setItem(legacyStorageKey, json);
            } catch(e) {}
        }

        async function init() {
            if (!courseIdParam && !pathParam) {
                // Show Hub View for all courses
                try {
                    const res = await fetch('/api/recordings/all');
                    const data = await res.json();
                    document.getElementById('loading-spinner').classList.add('hidden');
                    document.getElementById('course-badge').innerText = 'מאגר הקלטות';
                    document.getElementById('course-title').innerText = 'מאגר הקלטות שיעורים ותרגולים';
                    document.getElementById('progress-pill-container').style.display = 'none';
                    renderCoursesHub(data.courses || []);
                } catch(e) {
                    console.error(e);
                    document.getElementById('loading-spinner').classList.add('hidden');
                    document.getElementById('error-message').innerText = 'שגיאה בטעינת הקורסים';
                    document.getElementById('error-box').classList.remove('hidden');
                }
                return;
            }

            loadLocalWatched();

            try {
                let fetchUrl = `/api/recordings/lessons?tz=${tz}`;
                if (courseIdParam) fetchUrl += `&courseId=${courseIdParam}`;
                if (pathParam) fetchUrl += `&path=${encodeURIComponent(pathParam)}`;

                const res = await fetch(fetchUrl);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'לא נמצאו הקלטות עבור קורס זה');
                }

                courseData = await res.json();

                // Merge server watched map
                if (courseData.watchedMap) {
                    for (const id in courseData.watchedMap) {
                        if (courseData.watchedMap[id]) watchedSet.add(id);
                    }
                    saveLocalWatched();
                }

                render();
            } catch (err) {
                console.error(err);
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('error-message').innerText = err.message;
                document.getElementById('error-box').classList.remove('hidden');
            }
        }

        function renderCoursesHub(courses) {
            const hubView = document.getElementById('courses-hub-view');
            const grid = document.getElementById('courses-hub-grid');
            hubView.classList.remove('hidden');
            grid.innerHTML = '';

            if (courses.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-400 p-8 portal-card rounded-xl">לא נמצאו קורסים עם הקלטות כרגע.</div>';
                return;
            }

            courses.forEach(c => {
                const card = document.createElement('a');
                card.href = `lessons.html?courseId=${c.id}`;
                card.className = 'portal-card rounded-xl p-4 flex flex-col justify-between hover:-translate-y-0.5 transition-all group text-right';
                
                const yearText = c.year === 1 ? 'שנה א\'' : (c.year === 2 ? 'שנה ב\'' : `שנה ${c.year}`);
                const semText = c.semester === 'A' ? 'סמסטר א\'' : 'סמסטר ב\'';

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">
                                ${yearText} • ${semText}
                            </span>
                            <span class="text-[11px] text-blue-700 font-bold bg-blue-50 px-2 py-0.5 rounded-full border border-blue-200">
                                ${c.totalLessons} שיעורים
                            </span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 group-hover:text-blue-600 transition-colors">
                            ${c.name}
                        </h3>
                        <p class="text-xs text-slate-400 mt-0.5">
                            ${c.hasMultipleSeries ? `${c.seriesCount} סדרות מוקלטות` : 'סדרת שיעורים מלאה'}
                        </p>
                    </div>

                    <div class="mt-4 pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-blue-600">
                        <span>כניסה לשיעורים</span>
                        <i class="fas fa-arrow-left transition-transform group-hover:-translate-x-1"></i>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function render() {
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('error-box').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');

            document.getElementById('course-title').innerText = `${courseData.courseName} - הקלטות שיעורים`;
            document.getElementById('course-badge').innerText = courseData.courseName;

            if (courseData.folderPath) {
                document.getElementById('open-in-drive-btn').href = `drive.html?path=${encodeURIComponent(courseData.folderPath)}`;
            }

            renderSeriesTabs();
            renderActiveSeries();
        }

        function getActiveSeries() {
            if (!courseData || !courseData.seriesList || courseData.seriesList.length === 0) return null;
            return courseData.seriesList[activeSeriesIndex] || courseData.seriesList[0];
        }

        function renderSeriesTabs() {
            const container = document.getElementById('series-tabs-container');
            const list = document.getElementById('series-tabs-list');

            if (!courseData.hasMultipleSeries || courseData.seriesList.length <= 1) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            list.innerHTML = '';

            courseData.seriesList.forEach((s, idx) => {
                const total = s.lessons.length;
                const watched = s.lessons.filter(l => watchedSet.has(l.id)).length;
                const btn = document.createElement('button');
                btn.className = `tab-pill ${idx === activeSeriesIndex ? 'active' : ''}`;
                btn.innerHTML = `
                    <span>${s.seriesName || `סדרה ${idx + 1}`}</span>
                    <span class="opacity-75 text-[11px] mr-1">(${watched}/${total})</span>
                `;
                btn.onclick = () => {
                    activeSeriesIndex = idx;
                    renderSeriesTabs();
                    renderActiveSeries();
                };
                list.appendChild(btn);
            });
        }

        function renderActiveSeries() {
            const activeSeries = getActiveSeries();
            if (!activeSeries) return;

            const lessons = activeSeries.lessons;
            const total = lessons.length;
            const watched = lessons.filter(l => watchedSet.has(l.id)).length;
            const unwatched = total - watched;
            const pct = total > 0 ? Math.round((watched / total) * 100) : 0;

            // Update Progress Pill
            document.getElementById('progress-text').innerText = `${watched}/${total} נצפו`;
            document.getElementById('progress-pct').innerText = `(${pct}%)`;

            // Update Filter counts
            document.getElementById('count-all').innerText = total;
            document.getElementById('count-unwatched').innerText = unwatched;
            document.getElementById('count-watched').innerText = watched;

            // Update Next Lesson Button (Header)
            const nextBtn = document.getElementById('next-lesson-btn');
            const nextText = document.getElementById('next-lesson-btn-text');
            const nextLesson = lessons.find(l => !watchedSet.has(l.id));

            if (nextLesson) {
                nextBtn.style.display = 'flex';
                nextText.innerText = `שיעור הבא: ${nextLesson.displayName}`;
                nextBtn.title = `לחץ לפתיחת ${nextLesson.displayName} בחלון חדש`;
            } else {
                nextBtn.style.display = 'none';
            }

            renderLessonsGrid(lessons);
        }

        function renderLessonsGrid(lessons) {
            const grid = document.getElementById('lessons-grid');
            const emptyState = document.getElementById('empty-filter-state');
            grid.innerHTML = '';

            const filtered = lessons.filter(lesson => {
                const isWatched = watchedSet.has(lesson.id);
                if (currentFilter === 'watched') return isWatched;
                if (currentFilter === 'unwatched') return !isWatched;
                return true;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(lesson => {
                const isWatched = watchedSet.has(lesson.id);

                const card = document.createElement('div');
                card.className = `lesson-card group ${isWatched ? 'is-watched' : ''}`;
                
                // Clicking anywhere on card (except checkbox) opens the lesson in a new window
                card.onclick = (e) => {
                    if (e.target.closest('.checkbox-btn')) return;
                    openLesson(lesson);
                };

                card.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        <!-- Checkbox Button: ONLY this marks/unmarks as watched -->
                        <button class="checkbox-btn w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition-colors ${
                            isWatched 
                                ? 'bg-emerald-500 text-white shadow-sm' 
                                : 'border border-slate-300 text-transparent hover:border-emerald-500 hover:text-emerald-500'
                        }" title="${isWatched ? 'סמן כלא נצפה' : 'סמן כנצפה'}" onclick="handleToggleWatched('${lesson.id}', event)">
                            <i class="fas fa-check text-[10px]"></i>
                        </button>

                        <div class="min-w-0 flex-1">
                            <div class="font-bold text-sm text-slate-800 truncate group-hover:text-blue-600 transition-colors">
                                ${lesson.displayName}
                            </div>
                            ${lesson.extraTitle ? `<div class="text-[11px] text-slate-400 truncate">${lesson.extraTitle}</div>` : ''}
                        </div>
                    </div>

                    <div class="shrink-0 flex items-center gap-1.5 text-slate-400 group-hover:text-blue-600 transition-colors">
                        <i class="fas fa-arrow-up-right-from-square text-xs"></i>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Open lesson in new tab - DOES NOT MARK AS WATCHED!
        function openLesson(lesson) {
            if (!lesson.url) {
                alert('לא נמצא קישור תקף עבור שיעור זה');
                return;
            }
            window.open(lesson.url, '_blank', 'noopener,noreferrer');
        }

        function handleWatchNextLesson() {
            const activeSeries = getActiveSeries();
            if (!activeSeries) return;
            const nextLesson = activeSeries.lessons.find(l => !watchedSet.has(l.id));
            if (nextLesson) {
                openLesson(nextLesson);
            }
        }

        function handleToggleWatched(lessonId, event) {
            if (event) event.stopPropagation();
            const willBeWatched = !watchedSet.has(lessonId);
            markLessonWatched(lessonId, willBeWatched);
        }

        function markLessonWatched(lessonId, isWatched) {
            if (isWatched) {
                watchedSet.add(lessonId);
            } else {
                watchedSet.delete(lessonId);
            }
            saveLocalWatched();

            if (tz && courseData) {
                const cid = courseData.courseId || courseData.folderPath;
                fetch('/api/recordings/progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tz,
                        courseId: cid,
                        lessonId,
                        watched: isWatched
                    })
                }).catch(() => {});
            }

            renderSeriesTabs();
            renderActiveSeries();
        }

        function handleMarkAllCurrentWatched(isWatched) {
            const activeSeries = getActiveSeries();
            if (!activeSeries) return;

            activeSeries.lessons.forEach(l => {
                if (isWatched) watchedSet.add(l.id);
                else watchedSet.delete(l.id);

                if (tz && courseData) {
                    const cid = courseData.courseId || courseData.folderPath;
                    fetch('/api/recordings/progress', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tz,
                            courseId: cid,
                            lessonId: l.id,
                            watched: isWatched
                        })
                    }).catch(() => {});
                }
            });

            saveLocalWatched();
            renderSeriesTabs();
            renderActiveSeries();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'unwatched', 'watched'].forEach(f => {
                const btn = document.getElementById(`filter-btn-${f}`);
                if (btn) {
                    if (f === filter) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });
            const activeSeries = getActiveSeries();
            if (activeSeries) {
                renderLessonsGrid(activeSeries.lessons);
            }
        }

        function handleGoBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else if (courseIdParam) {
                window.location.href = `drive.html?courseId=${courseIdParam}`;
            } else {
                window.location.href = 'index.html';
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
