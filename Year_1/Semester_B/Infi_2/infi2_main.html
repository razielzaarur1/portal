<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אינפי 2 - בחירת מקור לימוד</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; }
        .header { text-align: center; margin-bottom: 40px; margin-top: 20px; }
        .header h1 { font-size: 2rem; color: #1e40af; margin-bottom: 5px; }
        .header p { color: #64748b; margin: 0; }
        .back-btn { align-self: flex-start; text-decoration: none; color: #64748b; font-weight: 500; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; background: white; padding: 8px 15px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .options-container { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 900px; }
        .option-btn { display: flex; align-items: center; padding: 20px; border-radius: 16px; text-decoration: none; transition: 0.2s; border: 1px solid #e2e8f0; }
        .option-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .opt-site { background: #ffffff; color: #1e293b; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .opt-site .opt-icon { background: #e2e8f0; color: #475569; }
        .opt-notebook { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-color: #bfdbfe; color: #1e40af; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1); }
        .opt-notebook .opt-icon { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; }
        .opt-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-left: 20px; flex-shrink: 0; }
        .opt-text h4 { margin: 0; font-size: 1.2rem; }
        .opt-text p { margin: 5px 0 0; font-size: 0.9rem; opacity: 0.8; }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-btn"><i class="fas fa-arrow-right"></i> חזרה לראשי</a>
    <div class="header">
        <h1>אינפי 2</h1>
        <p>בחר מקור לימוד</p>
    </div>
        <div class="options-container">
    </div>

    
    <!-- כפתור מעבר להקלטות ושיעורים (מוצג אוטומטית אם קיימות הקלטות לקורס זה) -->
    <div id="recordings-banner-container" style="width: 100%; max-width: 1000px; margin-bottom: 20px; display: none;">
        <a id="recordings-banner-link" href="../../../lessons.html" style="display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); color: white; padding: 16px 22px; border-radius: 18px; text-decoration: none; box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.35); transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px;">
                    <i class="fas fa-play"></i>
                </div>
                <div>
                    <div style="font-size: 1.1rem; font-weight: 700;">הקלטות קורס - שיעורים ותרגולים מוקלטים ומעקב התקדמות</div>
                    <div style="font-size: 0.85rem; opacity: 0.9; margin-top: 2px;">צפייה ישירה בהקלטות, סימון שיעורים שנצפו וכפתור למעבר לשיעור הבא</div>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; background: white; color: #991b1b; padding: 8px 16px; border-radius: 10px; font-size: 0.85rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <span>מעבר להקלטות</span>
                <i class="fas fa-arrow-left"></i>
            </div>
        </a>
    </div>

    <script>
        (function() {
            const iframe = document.getElementById('course-drive-iframe');
            if (!iframe) return;
            const src = iframe.getAttribute('src') || '';
            const match = src.match(/courseId=(\d+)/);
            if (!match) return;
            const courseId = match[1];
            fetch('/api/recordings/check?courseId=' + courseId)
                .then(r => r.json())
                .then(data => {
                    if (data && (data.hasRecordings || data.hasMiluim)) {
                        const container = document.getElementById('recordings-banner-container');
                        const link = document.getElementById('recordings-banner-link');
                        if (container && link) {
                            link.href = '../../../lessons.html?courseId=' + courseId;
                            container.style.display = 'block';
                        }
                    }
                }).catch(() => {});
        })();
    </script>

    <!-- מוזרק אוטומטית: חלונית הדרייב -->
    <div style="width: 100%; max-width: 1000px; margin-top: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e2e8f0;">
        <div style="background: #f8fafc; padding: 15px 20px; border-bottom: 1px solid #e2e8f0; font-weight: bold; color: #1e40af; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-folder-open"></i> קבצי הקורס
        </div>
        <iframe id="course-drive-iframe" src="../../../drive.html?courseId=6&embed=true" style="width: 100%; height: 600px; border: none;"></iframe>
    
</body>
</html>
