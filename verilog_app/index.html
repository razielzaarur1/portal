<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>VeriLearn — למידת Verilog מכל מקום</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div id="app">
    <!-- Header Bar -->
    <header id="top-bar">
      <div class="brand-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span>VeriLearn</span>
      </div>
      <div class="header-actions" style="display: flex; align-items: center; gap: 8px;">
        <button id="bug-report-btn" class="icon-btn" title="דיווח על תקלה / צ'אט" aria-label="Report Bug" onclick="window.VeriLearnChat ? window.VeriLearnChat.open() : null" style="background: rgba(99, 102, 241, 0.2); color: var(--accent-primary); border-radius: 12px; padding: 4px 10px; font-weight: 600; font-size: 0.82rem; display: flex; align-items: center; gap: 4px;">
          💬 <span>דיווח על תקלה</span>
        </button>
        <button id="lang-toggle-btn" class="icon-btn" title="החלף שפה / Switch Language" aria-label="Toggle language">
          <span id="lang-flag">🇮🇱</span>
        </button>
      </div>
    </header>

    <!-- Main View Container -->
    <main id="view-container">
      <!-- Dynamic content rendered by router -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav">
      <a href="#home" class="nav-item active" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span data-i18n="navHome">בית</span>
      </a>
      <a href="#lessons" class="nav-item" data-view="lessons">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span data-i18n="navLessons">שיעורים</span>
      </a>
      <a href="#progress" class="nav-item" data-view="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 20V10"></path>
          <path d="M12 20V4"></path>
          <path d="M6 20v-6"></path>
        </svg>
        <span data-i18n="navProgress">התקדמות</span>
      </a>
      <a href="#settings" class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span data-i18n="navSettings">הגדרות</span>
      </a>
    </nav>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/i18n.js"></script>
  <script src="js/progress.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/waveform.js"></script>
  <script src="js/circuit.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
